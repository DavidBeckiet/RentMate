x-application-hardening: &application-hardening
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The init script creates the isolated databases for this fixed owner.
      # Override the password only; changing the user would leave the bootstrap
      # database ownership inconsistent.
      POSTGRES_USER: rentmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - microservices_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-microservices.sql:/docker-entrypoint-initdb.d/10-microservices.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  identity:
    <<: *application-hardening
    image: rentmate-identity:${RENTMATE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        SERVICE: identity-service
        RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
        SOURCE_REVISION: ${RENTMATE_SOURCE_REVISION:-unknown}
    environment: &service-environment
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: rentmate
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN_SECONDS: "7200"
      BCRYPT_COST: ${BCRYPT_COST:-12}
      # Local development runs through http://localhost; production deployments
      # must explicitly set COOKIE_SECURE=true in their environment.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_IMAGES_PER_LISTING: "8"
      MAX_IMAGE_BYTES: "5242880"
      DEPLOYMENT_REGION: HO_CHI_MINH_CITY_VN
      MAX_SEARCH_RADIUS_KM: "50"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:?NOMINATIM_USER_AGENT is required}
      VERIFICATION_DELIVERY_URL: ${VERIFICATION_DELIVERY_URL:-}
      VERIFICATION_DELIVERY_TOKEN: ${VERIFICATION_DELIVERY_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-10000}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      RENTMATE_RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:4001/api/v1/auth/google/callback}
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:?SERVICE_INTERNAL_TOKEN is required}
      IDENTITY_DB_NAME: rentmate_identity
      IDENTITY_SERVICE_PORT: 4100
      OTEL_SERVICE_NAME: rentmate-identity
    command: ["sh", "-c", "npm --prefix services/identity-service run start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4100/api/health | grep -q 'status.*ok'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  listing:
    <<: *application-hardening
    image: rentmate-listing:${RENTMATE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        SERVICE: listing-service
        RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
        SOURCE_REVISION: ${RENTMATE_SOURCE_REVISION:-unknown}
    environment:
      <<: *service-environment
      IDENTITY_SERVICE_URL: http://identity:4100
      ENGAGEMENT_SERVICE_URL: http://engagement:4300
      LISTING_DB_NAME: rentmate_listing
      LISTING_SERVICE_PORT: 4200
      OTEL_SERVICE_NAME: rentmate-listing
      LISTING_STALE_REMINDER_DAYS: ${LISTING_STALE_REMINDER_DAYS:-30}
      LISTING_STALE_GRACE_DAYS: ${LISTING_STALE_GRACE_DAYS:-7}
      LISTING_STALE_SCAN_INTERVAL_MS: ${LISTING_STALE_SCAN_INTERVAL_MS:-30000}
      LISTING_STALE_BATCH_SIZE: ${LISTING_STALE_BATCH_SIZE:-100}
    command: ["sh", "-c", "npm --prefix services/listing-service run start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4200/api/health | grep -q 'status.*ok'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      identity:
        condition: service_healthy

  engagement:
    <<: *application-hardening
    image: rentmate-engagement:${RENTMATE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        SERVICE: engagement-service
        RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
        SOURCE_REVISION: ${RENTMATE_SOURCE_REVISION:-unknown}
    environment:
      <<: *service-environment
      IDENTITY_SERVICE_URL: http://identity:4100
      LISTING_SERVICE_URL: http://listing:4200
      ENGAGEMENT_DB_NAME: rentmate_engagement
      ENGAGEMENT_SERVICE_PORT: 4300
      OTEL_SERVICE_NAME: rentmate-engagement
      ROOMMATE_AI_PROVIDER: ${ROOMMATE_AI_PROVIDER:-DISABLED}
      ROOMMATE_AI_ENABLED: ${ROOMMATE_AI_ENABLED:-false}
      ROOMMATE_AI_PARSER_ENABLED: ${ROOMMATE_AI_PARSER_ENABLED:-false}
      ROOMMATE_AI_RECOMMENDATION_ENABLED: ${ROOMMATE_AI_RECOMMENDATION_ENABLED:-false}
      ROOMMATE_AI_EXPLANATION_ENABLED: ${ROOMMATE_AI_EXPLANATION_ENABLED:-false}
      ROOMMATE_AI_SAFETY_MODE: ${ROOMMATE_AI_SAFETY_MODE:-OFF}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ROOMMATE_AI_PARSER_MODEL: ${ROOMMATE_AI_PARSER_MODEL:-}
      ROOMMATE_AI_RECOMMENDATION_MODEL: ${ROOMMATE_AI_RECOMMENDATION_MODEL:-}
      ROOMMATE_AI_EXPLANATION_MODEL: ${ROOMMATE_AI_EXPLANATION_MODEL:-}
      ROOMMATE_AI_SAFETY_MODEL: ${ROOMMATE_AI_SAFETY_MODEL:-}
      ROOMMATE_AI_PARSER_TIMEOUT_MS: ${ROOMMATE_AI_PARSER_TIMEOUT_MS:-5000}
      ROOMMATE_AI_RECOMMENDATION_TIMEOUT_MS: ${ROOMMATE_AI_RECOMMENDATION_TIMEOUT_MS:-8000}
      ROOMMATE_AI_EXPLANATION_TIMEOUT_MS: ${ROOMMATE_AI_EXPLANATION_TIMEOUT_MS:-5000}
      ROOMMATE_AI_SAFETY_TIMEOUT_MS: ${ROOMMATE_AI_SAFETY_TIMEOUT_MS:-6000}
      ROOMMATE_AI_MAX_CONCURRENCY: ${ROOMMATE_AI_MAX_CONCURRENCY:-4}
      ROOMMATE_AI_ROLLOUT_PERCENTAGE: ${ROOMMATE_AI_ROLLOUT_PERCENTAGE:-0}
    command: ["sh", "-c", "npm --prefix services/engagement-service run start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4300/api/health | grep -q 'status.*ok'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      listing:
        condition: service_healthy

  verification-delivery:
    <<: *application-hardening
    profiles: ["brevo"]
    image: rentmate-verification-delivery:${RENTMATE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.microservices
      args:
        SERVICE: verification-delivery-adapter
        RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
        SOURCE_REVISION: ${RENTMATE_SOURCE_REVISION:-unknown}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VERIFICATION_DELIVERY_ADAPTER_PORT: ${VERIFICATION_DELIVERY_ADAPTER_PORT:-4400}
      VERIFICATION_DELIVERY_TOKEN: ${VERIFICATION_DELIVERY_TOKEN:-}
      EMAIL_DELIVERY_PROVIDER: ${EMAIL_DELIVERY_PROVIDER:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_EMAIL_SENDER: ${BREVO_EMAIL_SENDER:-}
      BREVO_EMAIL_SENDER_NAME: ${BREVO_EMAIL_SENDER_NAME:-RentMate}
      BREVO_API_BASE_URL: ${BREVO_API_BASE_URL:-https://api.brevo.com}
      BREVO_TIMEOUT_MS: ${BREVO_TIMEOUT_MS:-5000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-5000}
      PHONE_DELIVERY_PROVIDER: ${PHONE_DELIVERY_PROVIDER:-}
      PHONE_DEV_PREVIEW_ENABLED: ${PHONE_DEV_PREVIEW_ENABLED:-false}
      SPEEDSMS_ACCESS_TOKEN: ${SPEEDSMS_ACCESS_TOKEN:-}
      SPEEDSMS_API_BASE_URL: ${SPEEDSMS_API_BASE_URL:-https://api.speedsms.vn/index.php}
      SPEEDSMS_TIMEOUT_MS: ${SPEEDSMS_TIMEOUT_MS:-5000}
    expose:
      - "${VERIFICATION_DELIVERY_ADAPTER_PORT:-4400}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:${VERIFICATION_DELIVERY_ADAPTER_PORT:-4400}/api/ready | grep -q 'status.*ready'"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    <<: *application-hardening
    image: rentmate-gateway:${RENTMATE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
        SOURCE_REVISION: ${RENTMATE_SOURCE_REVISION:-unknown}
    environment:
      GATEWAY_PORT: 4001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      IDENTITY_SERVICE_URL: http://identity:4100
      LISTING_SERVICE_URL: http://listing:4200
      ENGAGEMENT_SERVICE_URL: http://engagement:4300
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:?SERVICE_INTERNAL_TOKEN is required}
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-10000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-10000}
      OTEL_SERVICE_NAME: rentmate-gateway
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      RENTMATE_RELEASE_VERSION: ${RENTMATE_RELEASE_VERSION:-development}
    command: ["npm", "--prefix", "services/api-gateway", "run", "start"]
    ports:
      - "${GATEWAY_PORT:-4001}:4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4001/api/health | grep -q 'status.*ok'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      identity:
        condition: service_healthy
      listing:
        condition: service_healthy
      engagement:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/rentmate-alerts.yml:/etc/prometheus/rentmate-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  microservices_postgres_data:
  prometheus_data:
  grafana_data:
